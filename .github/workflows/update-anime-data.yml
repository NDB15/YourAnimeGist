name: Update Anime Database

on:
  schedule:
    # Run daily at 3:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'anime_data.json'  # Also trigger if data file is modified

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          pip install requests
          
      - name: Check if data file is empty or missing
        id: check_data
        run: |
          if [ ! -f anime_data.json ]; then
            echo "Data file missing"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          elif [ ! -s anime_data.json ]; then
            echo "Data file is empty"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          elif [ $(wc -c < anime_data.json) -lt 1000 ]; then
            echo "Data file is too small (less than 1KB)"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            # Check if we have at least 28000 anime
            anime_count=$(python -c "import json; print(len(json.load(open('anime_data.json'))))" 2>/dev/null || echo "0")
            echo "Current anime count: $anime_count"
            if [ "$anime_count" -lt 28000 ]; then
              echo "Anime count is below 28000, needs update"
              echo "needs_update=true" >> $GITHUB_OUTPUT
            else
              echo "Data file exists and has sufficient content"
              echo "needs_update=false" >> $GITHUB_OUTPUT
            fi
          fi
          
      - name: Run scraper
        run: |
          python scraper.py
          
      - name: Check if data changed
        id: check_changes
        run: |
          git diff --quiet anime_data.json || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push if changed or was empty
        if: steps.check_changes.outputs.changed == 'true' || steps.check_data.outputs.needs_update == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add anime_data.json
          git commit -m "🔄 Auto-update anime database - $(date +'%Y-%m-%d %H:%M UTC')"
          git push
